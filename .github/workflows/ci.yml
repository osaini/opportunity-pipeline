name: CI
# Branch pushes are covered by their pull request; triggering on both ran every
# PR commit twice. A branch with no PR open gets no CI until one is opened.
on:
  push:
    branches: [main]
  pull_request:
  # Run everything, portability included, on a branch before merging a change
  # that touches paths, processes, or setup: Actions > CI > Run workflow.
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.lock
      - run: pip install -r requirements-web.lock pip-audit
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: node --check opportunity_app/static/app.js
      - run: node --check opportunity_app/static/ops.js
      - run: node --check apps/extension/adapters.js && node --check apps/extension/field-engine.js && node --check apps/extension/content.js && node --check apps/extension/sidepanel.js && node --check apps/extension/service-worker.js
      - run: node --check apps/extension/lib/base64.js
      - run: node tests/extension/run_tests.mjs
      - run: pip-audit -r requirements-web.lock
  portability:
    # Students run their own copies on Windows 10/11 and macOS, not only Linux.
    # This covers the unit suite, first-run setup, and the extension tests on
    # each, plus the oldest supported Python. These are the slowest and most
    # expensive jobs and rarely fail, so they run on pushes to main (after a
    # merge) and on manual dispatch, not on every pull request commit.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-web.lock
      - name: Keep temp files off the Windows C drive
        # The hosted Windows runner has two virtual disks, and the default TEMP
        # is on C:, the slow one. Measured 2026-09-23 with this exact command,
        # both ways on each of 6 VMs, order counterbalanced: mean 12.4 minutes
        # with TEMP on C:, 3.5 on D:, and D: faster on every VM (2.9x-6.4x).
        # Defender real-time scanning is already off on these runners, and
        # running the suite in parallel did not help.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: python -m pip install -r requirements-web.lock
      - run: python -m unittest discover -s tests
      - name: First-run setup on a clean checkout
        run: |
          python -m opportunity_app.setup init
          python -m opportunity_app.setup validate
          python -m opportunity_app.setup --json status
      - run: node tests/extension/run_tests.mjs

  ui:
    # Browser-driven UI/UX checks: page smoke, the student journey, axe
    # accessibility scans, keyboard/focus behaviour, and the responsive matrix.
    # Kept separate from `test` so the fast unittest feedback loop is unaffected
    # by a browser download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-web.lock
            requirements-ui.txt
      - run: pip install -r requirements-web.lock -r requirements-ui.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ui.txt') }}
      - run: python -m playwright install --with-deps chromium
      # Visual baselines are per-platform and are not committed for Linux, so the
      # `visual` marker stays deselected here (see tests/ui/visual.py).
      - run: python -m pytest tests/ui -v --tracing=retain-on-failure --output=data/ui-artifacts
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: data/ui-artifacts
          retention-days: 7

  extension-browser:
    # Real MV3 persistent-context checks against a loopback ATS fixture. The
    # harness copy pre-grants only the production optional loopback pattern,
    # because headless Chromium cannot interact with its permission bubble.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension:browser

  api-fuzz:
    # Property-based fuzzing of every operation in the generated OpenAPI schema,
    # looking for unhandled exceptions. This is a required gate now that the
    # previously pinned Unicode credential failures are fixed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # schemathesis pins starlette<1 and this project pins starlette==1.3.1, so
      # the fuzzer cannot share an environment with the application it targets.
      - run: python -m venv .venv-ui && .venv-ui/bin/pip install -r requirements-web.lock
      - run: python -m venv .venv-fuzz && .venv-fuzz/bin/pip install -r requirements-fuzz.txt
      - run: .venv-ui/bin/python scripts/run_api_fuzz.py --max-examples 20
      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-fuzz-report
          path: data/api-fuzz-report.xml
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Not the -alpine image. Alpine's musl libc compares text by raw bytes
        # whatever locale the database reports, so on it the company-sort
        # collation test passes even with the COLLATE "C" fix removed -- it
        # cannot catch the bug it exists for. The glibc image sorts
        # en_US.utf8 linguistically, like most hosted PostgreSQL, and there
        # the test fails without the fix. Verified both ways on 2026-09-21.
        image: postgres:17
        env:
          POSTGRES_DB: opportunity_test
          POSTGRES_USER: opportunity
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opportunity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.lock
      - run: pip install -r requirements-web.lock
      - run: python -m unittest tests.test_postgres -v
        env:
          POSTGRES_TEST_URL: postgresql://opportunity:test-only-password@127.0.0.1:5432/opportunity_test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A contributor who never ran setup init has no local hooks. The runner
      # holds nobody's personal files, so this catches personal files by path
      # (a .env, a resume, anything under data/), in every commit of the PR.
      - run: python3 scripts/check_personal_data.py --all
