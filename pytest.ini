; pytest configuration for the browser and contract suites only.
;
; The stdlib unittest suite under tests/*.py remains the primary test surface and
; is still run with `python -m unittest discover -s tests`. pytest is scoped to
; tests/ui here so the two never collide: unittest discovery skips tests/ui
; because it is not an importable package, and pytest is pointed away from the
; unittest modules by testpaths.
[pytest]
testpaths = tests/ui
addopts =
    --strict-markers
    --tb=short
    -m "not visual"
markers =
    visual: screenshot-baseline comparisons; platform-specific, excluded by default
    allow_page_errors: the test deliberately provokes a console error or 4xx and asserts on it itself
; Browser defaults. Override per run, e.g. `--headed --slowmo 300` when watching a flow.
; --output collects traces, screenshots, and videos for failures.
