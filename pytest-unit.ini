; Optional parallel runner for the stdlib unittest suite under tests/*.py.
;
; This is deliberately a SEPARATE config from pytest.ini. pytest.ini is scoped to
; tests/ui and carries browser options; pointing it at tests/ as well would drag
; Playwright, a browser install, and a live server into a run that needs none of
; them. Two files means neither run can inherit the other's assumptions.
;
;   py -3 -m pytest -c pytest-unit.ini -n auto
;
; `py -3 -m unittest discover -s tests` stays the primary command, runs
; everything including the files ignored below, and is unaffected by this file.
;
; Ignored here:
;   tests/ui              -- the browser suite; belongs to pytest.ini.
;   tests/test_postgres.py -- resets the shared `public` schema in setUpClass
;                             rather than allocating a database per worker, so
;                             two xdist workers would destroy each other's
;                             schema whenever POSTGRES_TEST_URL is set.
;   tests/test_scheduled_tasks.py -- drives the real launcher and kills its
;                             process tree mid-step on a timer. It passes
;                             reliably alone but flaked under -n auto load
;                             (seen 2026-09-21: 1 failure, then 3/3 passes
;                             in isolation). It was left in on the grounds
;                             that exclusion should wait for evidence; this
;                             is the evidence.
[pytest]
testpaths = tests
addopts =
    --strict-markers
    --tb=short
    --ignore=tests/ui
    --ignore=tests/test_postgres.py
    --ignore=tests/test_scheduled_tasks.py
