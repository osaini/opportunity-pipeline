<meta charset="utf-8">
<title>TITLE_PLACEHOLDER</title>
<style>
  /* ATS-safe by construction: one column, no tables, no text boxes, no images,
     no headers/footers, and standard section headings. Everything is real
     selectable text so a parser reads it in document order.

     System fonts on purpose -- an embedded webfont has no ATS benefit and can
     garble the extracted text layer in some parsers. */
  :root {
    --ink: #111;
    --muted: #444;
    --rule: #999;
    --page-margin: 0.5in;
  }
  @page { size: Letter; margin: var(--page-margin); }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10.5pt;
    line-height: 1.34;
    color: var(--ink);
    max-width: 7.5in;
    margin: 0 auto;
    padding: var(--page-margin);
  }
  @media print { body { padding: 0; max-width: none; } }

  header { text-align: center; margin-bottom: 10pt; }
  h1 {
    font-size: 19pt;
    letter-spacing: 0.02em;
    margin: 0 0 3pt;
    font-weight: 700;
  }
  .contact { font-size: 9.5pt; color: var(--muted); }
  .contact a { color: inherit; text-decoration: none; }
  .contact span + span::before { content: "  \00b7  "; color: var(--rule); }

  h2 {
    font-size: 10.5pt;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2pt;
    margin: 12pt 0 6pt;
    font-weight: 700;
  }
  section:first-of-type h2 { margin-top: 6pt; }

  .entry { margin-bottom: 7pt; page-break-inside: avoid; }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12pt;
  }
  .entry-title { font-weight: 700; }
  .entry-dates { font-size: 9.5pt; color: var(--muted); white-space: nowrap; }
  .entry-sub { font-style: italic; color: var(--muted); font-size: 10pt; }

  ul { margin: 3pt 0 0; padding-left: 16pt; }
  li { margin-bottom: 1.5pt; }

  .skills-row { margin-bottom: 3pt; }
  .skills-label { font-weight: 700; }

  /* Terms the target posting also asks for. Bold only -- the wording is never
     changed, just given weight, so the claim stays exactly what you wrote. */
  .match { font-weight: 700; }

  p.summary { margin: 0 0 2pt; }
  a { color: inherit; }
</style>

<header>
  <h1>NAME_PLACEHOLDER</h1>
  <div class="contact">CONTACT_PLACEHOLDER</div>
</header>
