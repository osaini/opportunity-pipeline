<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Application for Robotics Software Intern at Example Robotics</title>
<!--
  FICTIONAL. Greenhouse lets each employer edit the confirmation page's wording, so a page that says
  "Thank you for applying" proves nothing: this one says it at the job's own address with the form
  still present. It is not a confirmation (spec 6.14).
-->
</head>
<body>
<script>
  window.__loader = {"boardToken":"examplerobotics","jobId":"4000000001","submitPath":"/examplerobotics/jobs/4000000001","confirmationPath":"/examplerobotics/jobs/4000000001/confirmation"};
</script>
<h1>Robotics Software Intern</h1>
<p role="status">Thank you for applying.</p>
<form id="application-form" method="post" action="https://boards.greenhouse.io/examplerobotics/jobs/4000000001" novalidate>
  <div class="field">
    <label for="first_name">First Name <span aria-hidden="true">*</span></label>
    <input id="first_name" name="first_name" type="text" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" aria-required="true">
  </div>
  <button type="submit" class="btn">Submit application</button>
</form>
</body>
</html>
